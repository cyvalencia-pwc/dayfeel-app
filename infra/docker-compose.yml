name: dayfeel
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Copy .env.example to .env}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
    ports:
    - 127.0.0.1:3306:3306
    volumes:
    - mysql-data:/var/lib/mysql
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE
        -e 'SELECT 1'
      interval: 10s
      timeout: 5s
      retries: 15
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?required}
    ports:
    - 127.0.0.1:27017:27017
    volumes:
    - mongo-data:/data/db
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD
        --authenticationDatabase admin --eval 'db.adminCommand({ping:1})'
      interval: 10s
      timeout: 5s
      retries: 15
  localstack:
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:latest}
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-dayfeel-private}
    ports:
    - 127.0.0.1:4566:4566
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - awslocal s3api head-bucket --bucket $$S3_BUCKET
      interval: 10s
      timeout: 5s
      retries: 20
  localstack-init:
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:latest}
    entrypoint:
    - /bin/bash
    - /init/init.sh
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-dayfeel-private}
    volumes:
    - ./localstack/init.sh:/init/init.sh:ro
    depends_on:
      localstack:
        condition: service_started
    networks:
    - backend
    restart: 'no'
  identity-service:
    build:
      context: ../services/identity-service
    profiles:
    - identity
    environment:
      DB_URL: jdbc:mysql://mysql:3306/dayfeel_identity
      DB_USER: ${MYSQL_USER:?required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?required}
      INTERNAL_KEY: ${INTERNAL_KEY:-}
      JWT_EPHEMERAL_KEYS: 'true'
      EVENTS_MODE: ${EVENTS_MODE:-log}
      STORAGE_MODE: ${STORAGE_MODE:-local}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DAYFEEL_STORAGE_ENDPOINT: http://localhost:4566
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
    - 127.0.0.1:8081:8081
    depends_on:
      mysql:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks:
    - backend
  kafka:
    image: apache/kafka:3.7.2
    ports:
    - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
    - kafka-data:/tmp/kraft-combined-logs
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
      interval: 10s
      timeout: 10s
      retries: 20
  kafka-init:
    image: apache/kafka:3.7.2
    entrypoint:
    - /bin/bash
    - /init/init-topics.sh
    volumes:
    - ./kafka/init-topics.sh:/init/init-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
    - backend
    restart: 'no'
networks:
  backend: {}
volumes:
  mysql-data: {}
  mongo-data: {}
  kafka-data: {}
