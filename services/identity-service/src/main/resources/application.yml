server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        allow.auto.create.topics: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 10000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dayfeel_identity}
    username: ${DB_USER:dayfeel}
    password: ${DB_PASSWORD:p@ssw0rd}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  level:
    # Framework record/exception logging can include submitted data. Audit metadata instead.
    org.springframework.kafka.listener: "OFF"
    org.springframework.kafka.support.LoggingProducerListener: "OFF"
  pattern:
    level: "%5p [traceId=%X{traceId:-none}]"
dayfeel:
  internal-key: ${INTERNAL_KEY:}
  jwt:
    issuer: dayfeel-identity
    audience: dayfeel
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    ephemeral-keys: ${JWT_EPHEMERAL_KEYS:false}
  storage:
    mode: ${STORAGE_MODE:local}
    endpoint: ${AWS_ENDPOINT_URL:}
  events:
    mode: ${EVENTS_MODE:log}
    outbound-topic: identity-events
    inbound-topic: content-events
    group-id: dayfeel-identity
