<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dayfeel Identity API — Swagger UI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
</head>
<body>
  <p id="loading">Loading Swagger UI. Internet access is needed to load the renderer.</p>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    if (window.SwaggerUIBundle) {
      document.getElementById('loading').remove();
      SwaggerUIBundle({url: './openapi.json', dom_id: '#swagger-ui', deepLinking: true,
        persistAuthorization: false, validatorUrl: null, displayRequestDuration: true});
    }
  </script>
</body>
</html>
